name: Build Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller "PySide6==6.12.0"

      - name: 打包
        run: python -m PyInstaller syncbuddy.spec --noconfirm --clean

      - name: 校验产物
        # exe 是 GUI 子系统，shell 的 & 和 cmd /c 都不会等它，拿不到退出码。
        # 用 Python 的 subprocess 才能真正等到进程结束。
        run: python tools/verify_build.py

      - name: 压缩
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION -Raw).Trim()
          $name = "SyncBuddy-v$ver-win64.zip"
          Compress-Archive -Path dist/SyncBuddy/* -DestinationPath $name
          Write-Host "产物：$name（$([math]::Round((Get-Item $name).Length/1MB,1)) MB）"
          "ZIP_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: SyncBuddy-win64
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: false
          append_body: |
            ## 下载

            解压后双击 `SyncBuddy.exe`。首次运行会弹配置向导。

            需要单独准备一个私有 git 仓库存放数据，位置：与 `SyncBuddy.exe`
            同级的 `wb-sync/` 目录，或者用环境变量 `WB_SYNC_REPO` 指定。
